# Playwright MCP on Render — Blueprint.
# Docs: https://render.com/docs/blueprint-spec
#
# Single Docker web service: a thin wrapper (Dockerfile.render) over the official
# mcr.microsoft.com/playwright/mcp image, which already bakes in headless Chromium.
# No health check is declared on purpose: /mcp is a Streamable-HTTP endpoint that
# does not answer a plain GET with 2xx, so Render's default open-port detection is
# the correct liveness signal here.
#
# The Playwright MCP version is pinned solely by the base-image tag in
# Dockerfile.render. Deliberately not repeated here — one literal, one place to
# change when rolling (see the README "Rolling Playwright MCP" section).
previews:
  generation: off

services:
  - type: web
    name: playwright-mcp
    runtime: docker
    region: oregon
    # Headless Chromium needs more than starter's 512 MB or it OOMs on launch.
    plan: standard
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    envVars:
      # Render routes external traffic to this port; the auth gate binds to it.
      - key: PORT
        value: 10000
      # Playwright MCP has no auth of its own and exposes an RCE-equivalent tool,
      # so every request must carry `Authorization: Bearer $MCP_TOKEN`. Render
      # generates the value at deploy time — copy it from the service's
      # Environment page into your MCP client. The container refuses to start if
      # this is unset, so there is no unauthenticated path.
      - key: MCP_TOKEN
        generateValue: true
